services:
  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile.${NODE_ENV:-dev}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - API_URL=${API_URL:-http://backend:8001}
      - HOST=0.0.0.0
    depends_on:
      - backend
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.${NODE_ENV:-dev}
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USERNAME=${DB_DEV_USERNAME:-root}
      - DB_PASSWORD=${DB_DEV_PASSWORD:-root}
      - DB_DATABASE=${DB_DEV_DATABASE:-trinity}
      - DB_DIALECT=mysql
      - JWT_SECRET=${JWT_SECRET}
      - SESSION_SECRET=${SESSION_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - PAYPAL_CLIENT_ID=${PAYPAL_CLIENT_ID}
      - PAYPAL_CLIENT_SECRET=${PAYPAL_CLIENT_SECRET}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      - db
    networks:
      - app-network

  db:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_DEV_PASSWORD:-root}
      - MYSQL_DATABASE=${DB_DEV_DATABASE:-trinity}
      - MYSQL_USER=${DB_DEV_USERNAME:-root}
      - MYSQL_PASSWORD=${DB_DEV_PASSWORD:-root}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/src/database:/docker-entrypoint-initdb.d
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mysql_data:
