stages:
  - test
  - build
  - deploy

test_backend:
  stage: test
  image: node:18
  allow_failure: true
  script:
    - cd backend
    - npm install --legacy-peer-deps
    - npx vitest run --coverage

test_frontend:
  stage: test
  image: node:18
  allow_failure: true
  script:
    - cd front
    - rm -rf node_modules package-lock.json
    - npm cache clean --force
    - npm install --legacy-peer-deps
    - npm run test:unit

sonarqube-check:
  stage: quality
  image: sonarsource/sonar-scanner-cli:latest
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    # - sonar-scanner -Dsonar.javascript.lcov.reportPaths=./application/coverage/lcov.info
    - sonar-scanner
  allow_failure: true
  only:
    - main
    - dev

build_backend:
  stage: build
  image: node:18
  script:
    - cd backend
    - npm install --legacy-peer-deps
    - npm run build
    - docker build -f Dockerfile.prod -t backend:latest .
  only:
    - main
    - zeyu

build_dev_backend:
  stage: build
  image: node:18
  script:
    - cd backend
    - npm install --legacy-peer-deps
    - npm run build
    - docker build -f Dockerfile.dev -t backend:latest .
  only:
    - dev

build_frontend:
  stage: build
  image: node:18
  script:
    - cd front
    - npm install --legacy-peer-deps
    - npm run build
    - docker build -f Dockerfile.prod -t frontend:latest .
  only:
    - main
    - zeyu

build_dev_frontend:
  stage: build
  image: node:18
  script:
    - cd front
    - npm install --legacy-peer-deps
    - npm run build
    - docker build -f Dockerfile.prod -t frontend:latest .
  only:
    - dev

deploy:
  stage: deploy
  image: docker/compose:latest
  services:
    - docker:dind
  script:
    - docker-compose up -d --force-recreate
  only:
    - main
    - zeyu

deploy_dev:
  stage: deploy
  image: docker/compose:latest
  services:
    - docker:dind
  script:
    - docker-compose up -d --force-recreate
  only:
    - dev
