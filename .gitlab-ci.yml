deploy:
  stage: deploy
  image: docker/compose:latest
  services:
    - docker:dind
  script:
    - docker-compose up -d --force-recreate
  only:
    - main
    - zeyu

deploy_dev:
  stage: deploy
  image: docker/compose:latest
  services:
    - docker:dind
  script:
    - docker-compose up -d --force-recreate
  only:
    - dev
