stages:
  - test
  - build
  - deploy

test_backend:
  stage: test
  image: node:18
  allow_failure: true
  script:
    - cd backend
    - npm install --legacy-peer-deps
    - npx vitest run --coverage

test_frontend:
  stage: test
  image: node:18
  allow_failure: true
  script:
    - cd front
    - rm -rf node_modules package-lock.json
    - npm cache clean --force
    - npm install -g npm@9.5.0
    - npm install --legacy-peer-deps
    - npm update
    - npm run test:unit

build_backend:
  stage: build
  image: node:18
  script:
    - cd backend
    - npm install --legacy-peer-deps
    - npm run build
    - docker build -f Dockerfile.prod -t backend:latest .
  only:
    - main
    - zeyu

